<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Prism Zero — local generation and explicit verification</title>
  <desc id="desc">A dark purple project card with a geometric prism motif and four workflow stages: generate, verify, curate, and train. Illustrative artwork.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#24133d"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="24" fill="url(#bg)" stroke="#524275" stroke-width="2"/>
  <g fill="none" stroke="url(#edge)" stroke-width="3"><path d="M1005 57 1100 220H910Z"/><path d="m1005 57 0 109 95 54m-95-54-95 54"/><circle cx="1005" cy="153" r="111" opacity=".22"/></g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="55" font-size="16" letter-spacing="3" fill="#c4b5fd">LOCAL AI / PYTHON TOOLKIT</text>
    <text x="48" y="118" font-size="52" font-weight="700" fill="#f8fafc">Prism Zero</text>
    <text x="48" y="161" font-size="23" fill="#e2e8f0">Generate locally. Verify explicitly. Train deliberately.</text>
    <text x="48" y="198" font-size="18" fill="#b9c3d6">Bounded retries, curated examples, and explicit local LoRA training.</text>
    <g fill="#1c2440" stroke="#65558b"><rect x="48" y="239" width="172" height="48" rx="12"/><rect x="238" y="239" width="172" height="48" rx="12"/><rect x="428" y="239" width="172" height="48" rx="12"/><rect x="618" y="239" width="172" height="48" rx="12"/></g>
    <g fill="#f1f5f9" font-size="18" text-anchor="middle"><text x="134" y="270">01 / Generate</text><text x="324" y="270">02 / Verify</text><text x="514" y="270">03 / Curate</text><text x="704" y="270">04 / Train</text></g>
    <text x="48" y="318" font-size="13" fill="#b9c3d6">DudeSquad999 / prism-zero · Illustrative workflow, not a benchmark</text>
