<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Prism Zero</title>
  <desc id="desc">Offline-first local AI toolkit for generating candidates, verifying outputs, curating accepted examples, and training local LoRA adapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171329"/>
      <stop offset="1" stop-color="#242044"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="prism-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a48cff"/>
      <stop offset="1" stop-color="#6a4bea"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="228" rx="20" fill="url(#bg)" stroke="#514477"/>
  <rect x="30" y="30" width="5" height="170" rx="2" fill="url(#edge)"/>

  <g font-family="system-ui, Segoe UI, Arial, sans-serif">
    <text x="62" y="55" fill="#c4b5fd" font-size="14" letter-spacing="3">LOCAL AI / VERIFY / TRAIN</text>
    <text x="60" y="111" fill="#faf5ff" font-size="48" font-weight="700">Prism <tspan fill="#c4b5fd">Zero</tspan></text>
    <text x="62" y="151" fill="#d2cce7" font-size="23">Generate locally. Verify explicitly. Train deliberately.</text>
    <text x="62" y="191" fill="#a9b7d1" font-size="17">PYTHON TOOLKIT · OFFLINE-FIRST · LOCAL LORA WORKFLOWS</text>
  </g>

  <g transform="translate(922 25) scale(6)" role="img" aria-label="Prism logo">
    <path d="M13 3 24 25H2Z" fill="url(#prism-face)"/>
    <path d="M18.5 13.5 35 8" fill="none" stroke="#ff7a93" stroke-linecap="round" stroke-width="2"/>
    <path d="M19.3 15.5 35 15" fill="none" stroke="#ffc35c" stroke-linecap="round" stroke-width="2"/>
    <path d="M20 17.5 35 22" fill="none" stroke="#4fd1a1" stroke-linecap="round" stroke-width="2"/>
  </g>
</svg>