<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="420"
  viewBox="0 0 1200 420"
  role="img"
  aria-labelledby="card-title card-description">

  <title id="card-title">
    Prism Zero — Generate. Verify. Curate. Train.
  </title>

  <desc id="card-description">
    Prism Zero project card featuring the original purple Prism logo
    with pink, amber, and green rays. Local generation, explicit
    verification, accepted-example curation, and local LoRA training.
    Illustrative artwork, not benchmark results.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1200"
      y2="420"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101322"/>
      <stop offset="0.52" stop-color="#171329"/>
      <stop offset="1" stop-color="#211638"/>
    </linearGradient>

    <linearGradient
      id="border"
      x1="0"
      y1="0"
      x2="1200"
      y2="420"
      gradientUnits="userSpaceOnUse">
      <stop
        offset="0"
        stop-color="#64748b"
        stop-opacity="0.55"/>
      <stop
        offset="0.5"
        stop-color="#a78bfa"
        stop-opacity="0.8"/>
      <stop
        offset="1"
        stop-color="#67e8f9"
        stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient
      id="accent"
      x1="48"
      y1="0"
      x2="1152"
      y2="0"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient
      id="prism-face"
      x1="0%"
      y1="0%"
      x2="0%"
      y2="100%">
      <stop offset="0" stop-color="#a48cff"/>
      <stop offset="1" stop-color="#6a4bea"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop
        offset="0"
        stop-color="#8b5cf6"
        stop-opacity="0.2"/>
      <stop
        offset="1"
        stop-color="#8b5cf6"
        stop-opacity="0"/>
    </radialGradient>

    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse">
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#c4b5fd"
        stroke-opacity="0.035"/>
    </pattern>

    <clipPath id="card-clip">
      <rect
        x="2"
        y="2"
        width="1196"
        height="416"
        rx="23"/>
    </clipPath>
  </defs>

  <!-- Rounded background -->
  <g clip-path="url(#card-clip)">
    <rect
      x="2"
      y="2"
      width="1196"
      height="416"
      fill="url(#background)"/>

    <rect
      x="2"
      y="2"
      width="1196"
      height="416"
      fill="url(#grid)"/>

    <ellipse
      cx="982"
      cy="153"
      rx="250"
      ry="220"
      fill="url(#halo)"/>
  </g>

  <!-- Inset border -->
  <rect
    x="2"
    y="2"
    width="1196"
    height="416"
    rx="23"
    fill="none"
    stroke="url(#border)"
    stroke-width="2"/>

  <!-- Top highlight -->
  <path
    d="M48 3H1152"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"
    stroke-linecap="round"/>

  <!-- Heading -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect
      x="48"
      y="35"
      width="218"
      height="29"
      rx="14.5"
      fill="#a78bfa"
      fill-opacity="0.1"
      stroke="#a78bfa"
      stroke-opacity="0.3"/>

    <circle
      cx="64"
      cy="49.5"
      r="3"
      fill="#67e8f9"/>

    <text
      x="77"
      y="54"
      fill="#ddd6fe"
      font-size="11"
      font-weight="600"
      letter-spacing="1.5">
      OFFLINE-FIRST / PYTHON
    </text>

    <text
      x="46"
      y="133"
      fill="#f8fafc"
      font-size="64"
      font-weight="700"
      letter-spacing="-2">
      Prism <tspan fill="#c4b5fd">Zero</tspan>
    </text>

    <text
      x="49"
      y="174"
      fill="#e2e8f0"
      font-size="23"
      font-weight="500">
      Local generation. Explicit verification.
    </text>

    <text
      x="49"
      y="207"
      fill="#aebad0"
      font-size="17">
      Curate accepted examples. Train local LoRA adapters.
    </text>

    <text
      x="49"
      y="234"
      fill="#aebad0"
      font-size="17">
      No hosted model API required.
    </text>
  </g>

  <!-- Original Prism logo -->
  <g transform="translate(858 48) scale(7)">
    <path
      d="M13 3 24 25H2Z"
      fill="url(#prism-face)"/>

    <path
      d="M18.5 13.5 35 8"
      fill="none"
      stroke="#ff7a93"
      stroke-linecap="round"
      stroke-width="2"/>

    <path
      d="M19.3 15.5 35 15"
      fill="none"
      stroke="#ffc35c"
      stroke-linecap="round"
      stroke-width="2"/>

    <path
      d="M20 17.5 35 22"
      fill="none"
      stroke="#4fd1a1"
      stroke-linecap="round"
      stroke-width="2"/>
  </g>

  <!-- Section divider -->
  <path
    d="M48 265H1152"
    fill="none"
    stroke="#c4b5fd"
    stroke-opacity="0.14"/>

  <!-- Workflow -->
  <g
    font-family="Segoe UI, Arial, sans-serif"
    stroke-linecap="round"
    stroke-linejoin="round">

    <!-- 01: Generate -->
    <rect
      x="48"
      y="284"
      width="252"
      height="78"
      rx="13"
      fill="#171b2f"
      stroke="#51426e"/>

    <rect
      x="62"
      y="301"
      width="42"
      height="42"
      rx="11"
      fill="#a78bfa"
      fill-opacity="0.12"/>

    <path
      d="m73 311 9 11-9 11M87 333H95"
      fill="none"
      stroke="#c4b5fd"
      stroke-width="2"/>

    <text
      x="117"
      y="315"
      fill="#f1f5f9"
      font-size="18"
      font-weight="600">
      Generate
    </text>

    <text
      x="117"
      y="338"
      fill="#aebad0"
      font-size="13">
      Local candidates
    </text>

    <text
      x="269"
      y="306"
      fill="#9b8db5"
      font-size="11">
      01
    </text>

    <!-- 02: Verify -->
    <rect
      x="332"
      y="284"
      width="252"
      height="78"
      rx="13"
      fill="#171b2f"
      stroke="#51426e"/>

    <rect
      x="346"
      y="301"
      width="42"
      height="42"
      rx="11"
      fill="#a78bfa"
      fill-opacity="0.12"/>

    <path
      d="m367 309 12 5v9c0 7-5 11-12 14-7-3-12-7-12-14v-9Z"
      fill="none"
      stroke="#c4b5fd"
      stroke-width="1.8"/>

    <path
      d="m361 322 4 4 8-9"
      fill="none"
      stroke="#c4b5fd"
      stroke-width="2"/>

    <text
      x="401"
      y="315"
      fill="#f1f5f9"
      font-size="18"
      font-weight="600">
      Verify
    </text>

    <text
      x="401"
      y="338"
      fill="#aebad0"
      font-size="13">
      Explicit constraints
    </text>

    <text
      x="553"
      y="306"
      fill="#9b8db5"
      font-size="11">
      02
    </text>

    <!-- 03: Curate -->
    <rect
      x="616"
      y="284"
      width="252"
      height="78"
      rx="13"
      fill="#171b2f"
      stroke="#51426e"/>

    <rect
      x="630"
      y="301"
      width="42"
      height="42"
      rx="11"
      fill="#818cf8"
      fill-opacity="0.12"/>

    <path
      d="m651 309 13 7-13 7-13-7 13-7Zm-13 15 13 7 13-7m-26 8 13 7 13-7"
      fill="none"
      stroke="#a5b4fc"
      stroke-width="1.8"/>

    <text
      x="685"
      y="315"
      fill="#f1f5f9"
      font-size="18"
      font-weight="600">
      Curate
    </text>

    <text
      x="685"
      y="338"
      fill="#aebad0"
      font-size="13">
      Accepted examples
    </text>

    <text
      x="837"
      y="306"
      fill="#9b8db5"
      font-size="11">
      03
    </text>

    <!-- 04: Train -->
    <rect
      x="900"
      y="284"
      width="252"
      height="78"
      rx="13"
      fill="#171b2f"
      stroke="#3e6879"/>

    <rect
      x="914"
      y="301"
      width="42"
      height="42"
      rx="11"
      fill="#67e8f9"
      fill-opacity="0.1"/>

    <path
      d="M923 333v-9m11 9v-16m11 16v-23"
      fill="none"
      stroke="#67e8f9"
      stroke-width="3"/>

    <text
      x="969"
      y="315"
      fill="#f1f5f9"
      font-size="18"
      font-weight="600">
      Train
    </text>

    <text
      x="969"
      y="338"
      fill="#aebad0"
      font-size="13">
      Explicit LoRA SFT
    </text>

    <text
      x="1121"
      y="306"
      fill="#81b4c0"
      font-size="11">
      04
    </text>

    <!-- Connecting arrows -->
    <g
      fill="none"
      stroke="#9484b6"
      stroke-width="1.5">
      <path d="M309 323H323m-5-5 5 5-5 5"/>
      <path d="M593 323H607m-5-5 5 5-5 5"/>
      <path d="M877 323H891m-5-5 5 5-5 5"/>
    </g>
  </g>

  <!-- Footer -->
  <g
    font-family="Segoe UI, Arial, sans-serif"
    font-size="12">

    <text
      x="49"
      y="393"
      fill="#aebad0">
      DudeSquad999 / prism-zero
    </text>

    <text
      x="1151"
      y="393"
      text-anchor="end"
      fill="#9b91af">
      Illustrative workflow · Not a benchmark
    </text>
  </g>
</svg>
