<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Aidan | DudeSquad999</title>
  <desc id="desc">Independent developer building Prism AI for research and writing, Prism Zero for local AI verification and training, and git-panic for safer Git recovery. The banner includes the purple Prism mark with pink, gold, and green rays, orbital lines, and a Git branch motif.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#201438"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".55" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="prism-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a48cff"/>
      <stop offset="1" stop-color="#6a4bea"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <path d="M32 290H1168" stroke="url(#accent)" stroke-width="3"/>

  <g font-family="system-ui, Segoe UI, Arial, sans-serif">
    <text x="58" y="67" fill="#b8accf" font-size="17" letter-spacing="4">DUDESQUAD999 / INDEPENDENT DEVELOPER</text>
    <text x="54" y="148" fill="#f8fafc" font-size="66" font-weight="700">Hi, I'm Aidan.</text>
    <text x="58" y="195" fill="#d2d8e8" font-size="25">I build tools for research, writing, and code.</text>
  </g>

  <!-- Project family -->
  <g font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing=".5">
    <rect x="58" y="224" width="105" height="36" rx="18" fill="#a78bfa" fill-opacity=".12" stroke="#7660ac"/>
    <text x="110.5" y="247" text-anchor="middle" fill="#ddd6fe">PRISM AI</text>

    <rect x="175" y="224" width="125" height="36" rx="18" fill="#67e8f9" fill-opacity=".09" stroke="#4d8395"/>
    <text x="237.5" y="247" text-anchor="middle" fill="#b9f3ff">PRISM ZERO</text>

    <rect x="312" y="224" width="115" height="36" rx="18" fill="#fb923c" fill-opacity=".09" stroke="#976047"/>
    <text x="369.5" y="247" text-anchor="middle" fill="#fdba74">GIT-PANIC</text>
  </g>

  <g fill="none" stroke-linecap="round">
    <circle cx="1000" cy="158" r="100" stroke="#a78bfa" stroke-opacity=".25"/>
    <ellipse cx="1000" cy="158" rx="138" ry="45" transform="rotate(-30 1000 158)" stroke="#67e8f9" stroke-opacity=".3"/>
    <path d="M1118 105V169Q1118 190 1096 190H1078" stroke="#fb923c" stroke-width="3"/>
  </g>
  <circle cx="1118" cy="99" r="7" fill="#fb923c"/>

  <g transform="translate(892 68) scale(6)" role="img" aria-label="Prism logo">
    <path d="M13 3 24 25H2Z" fill="url(#prism-face)"/>
    <path d="M18.5 13.5 35 8" fill="none" stroke="#ff7a93" stroke-linecap="round" stroke-width="2"/>
    <path d="M19.3 15.5 35 15" fill="none" stroke="#ffc35c" stroke-linecap="round" stroke-width="2"/>
    <path d="M20 17.5 35 22" fill="none" stroke="#4fd1a1" stroke-linecap="round" stroke-width="2"/>
  </g>
</svg>