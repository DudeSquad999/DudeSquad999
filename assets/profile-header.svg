<g font-family="system-ui,Segoe UI,Arial,sans-serif"><text x="58" y="67" fill="#b8accf" font-size="17" letter-spacing="4">DUDESQUAD999 / INDEPENDENT DEVELOPER</text><text x="54" y="148" fill="#f8fafc" font-size="66" font-weight="700">Hi, I'm Aidan.</text><text x="58" y="195" fill="#d2d8e8" font-size="25">I build tools for research, writing, and code.</text><rect x="58" y="224" width="260" height="36" rx="18" fill="#a78bfa" fill-opacity=".12" stroke="#7660ac"/><text x="82" y="248" fill="#ddd6fe" font-size="16">PRISM AI + GIT-PANIC</text></g>
